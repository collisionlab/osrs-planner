plugins {
    id 'application'
}

dependencies {
    implementation project(':routing')
    implementation 'io.javalin:javalin:5.6.5'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
    implementation 'com.networknt:json-schema-validator:1.5.9'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'
    implementation 'io.micrometer:micrometer-registry-prometheus:1.13.6'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.21'
    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:8.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'io.javalin:javalin-testtools:5.6.5'
}

application {
    applicationName = 'shortest-path-service'
    mainClass = 'shortestpath.service.ServiceMain'
}

// The item catalog lists exactly the items the current transport data can require. Its names are
// regenerated from Chisel whenever the service is built, including the deploy image build.
// Pass -PitemNamesSource=/path/to/itemsmin.js to build offline.
def itemNamesSource = providers.gradleProperty('itemNamesSource')
    .orElse('https://chisel.weirdgloop.org/moid/data_files/itemsmin.js')
def routeItemNamesDir = layout.buildDirectory.dir('generated/route-item-names')
def generateRouteItemNames = tasks.register('generateRouteItemNames', JavaExec) {
    description = 'Writes route-item-names.tsv for every item the current transports can require.'
    classpath = sourceSets.main.output.classesDirs + configurations.runtimeClasspath
    mainClass = 'shortestpath.service.RouteItemNames'
    maxHeapSize = '1g'
    // Use the service's logging rather than the RuneLite client's, which writes to ~/.runelite.
    systemProperty 'logback.configurationFile', file('src/main/resources/logback.xml').path
    inputs.property('itemNamesSource', itemNamesSource)
    outputs.dir(routeItemNamesDir)
    argumentProviders.add({
        [itemNamesSource.get(), routeItemNamesDir.get().file('route-item-names.tsv').asFile.path]
    } as CommandLineArgumentProvider)
}

// The API contracts live in the repository's corpus/schemas.
def corpusDir = rootProject.file('corpus')

processResources {
    from(generateRouteItemNames)
    from(new File(corpusDir, 'schemas')) { into 'schemas' }
}

test {
    useJUnitPlatform()
    jvmArgs = ['-Xms512m', '-Xmx4g']
}
