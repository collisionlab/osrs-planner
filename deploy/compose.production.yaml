name: osrs-travel

services:
  service:
    image: osrs-travel-service:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      JAVA_OPTS: "-Xms${SERVICE_HEAP_MIN:-1g} -Xmx${SERVICE_HEAP_MAX:-5g}"
      PORT: "8080"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: ${SERVICE_MEMORY_LIMIT:-6g}
    cpus: ${SERVICE_CPU_LIMIT:-2}
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    networks: [app]

  web:
    image: osrs-travel-web:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    depends_on:
      service:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
